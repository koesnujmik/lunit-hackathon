[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lunit-l2-baseline"
version = "0.1.0"
description = "Two-stage medical chatbot harness for Lunit FM L2"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "openai>=1.68,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
l2-chat = "l2_baseline.cli:main"
l2-simulator = "l2_baseline.simulator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/l2_baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
