[project]
name = "lunit-hackathon"
version = "0.3.1"
description = "Minimal Lunit L2 driver for the HealthBench track"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lunit-answer = "lunit_hackathon.run_once:main"
lunit-simulator = "lunit_hackathon.run_simulator:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
